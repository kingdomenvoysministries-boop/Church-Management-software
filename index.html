  <style>
    :root {
      color-scheme: light;
      --page: #f9f4f4;
      --surface: #fff;
      --surface-soft: #fbf9f5;
      --ink: #3a1219;
      --muted: #847277;
      --line: #ede8e3;
      --green: #5f1e29;
      --green-deep: #49171f;
      --green-soft: #f5edee;
      --gold: #c18b45;
      --gold-soft: #f8f0e3;
      --rose: #a94f4b;
      --rose-soft: #f8eceb;
      --blue: #536e8c;
      --shadow: 0 16px 48px rgba(70, 20, 32, .07);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 14.5px/1.55 Nunito, ui-rounded, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; flex-direction: column; width: 248px; overflow-y: auto; padding: 25px 16px 17px; border-right: 1px solid var(--line); background: #fcfbf8; }
    .brand { display: flex; gap: 11px; align-items: center; padding: 2px 9px 29px; color: var(--ink); text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--green); color: #fff; }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand b { display: block; font-family: Lora, Georgia, "Times New Roman", serif; font-size: 17px; letter-spacing: -.3px; }
    .brand small { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; }
    .nav-label { margin: 2px 11px 9px; color: #a19396; font-size: 9px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
    .nav-list { display: grid; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 11px; background: transparent; color: #77676b; text-align: left; transition: .18s ease; }
    .nav-item:hover { background: #f7f1f2; color: var(--green); }
    .nav-item.active { background: var(--green-soft); color: var(--green-deep); font-weight: 700; }

    /* ===== Polish layer ===== */
    :root { --muted: #6d5f62; --focus: #802937; }
    [data-theme="dark"] { --focus: #d4a5ad; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-size: 15px; }
    ::selection { background: var(--green-soft); color: var(--green-deep); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
    .input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: none; }
    .skip-link { position: fixed; left: 12px; top: -60px; z-index: 200; padding: 10px 14px; border-radius: 10px; background: var(--green); color: #fff; font-weight: 700; text-decoration: none; transition: top .15s; }
    .skip-link:focus { top: 12px; }

    .nav-item, .button, .icon-button, .card { transition: background .18s ease, border-color .18s ease, color .18s ease, box-shadow .2s ease, transform .18s ease; }
    .card { border-radius: var(--radius); }
    .card:hover { box-shadow: 0 18px 52px rgba(70,20,32,.09); }
    .button:active, .icon-button:active { transform: translateY(0) scale(.98); }
    .icon-button { width: 40px; height: 40px; }
    .button { min-height: 40px; font-size: 12px; }
    .button.small { min-height: 32px; font-size: 11px; }
    .top-title p, .page-heading p, .save-state { font-size: 12px; }
    .checkbox-line, .notice, .detail-field small { font-size: 11px; }
    .footer-line { font-size: 11px; color: var(--muted); }
    .modal-backdrop { animation: fadeIn .18s ease both; backdrop-filter: blur(3px); }
    .modal { animation: popIn .22s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
    .toast { border-radius: 14px; }
    .scrim { position: fixed; inset: 0; z-index: 15; background: rgba(30,8,14,.42); backdrop-filter: blur(2px); animation: fadeIn .18s ease both; }
    .sidebar { scrollbar-width: thin; }

    @media (prefers-reduced-motion: reduce) {

    }

    /* ===== Theme v5: Forest & Marigold — drifting colour background, coloured edge on every card, pill buttons ===== */
    :root {
      --page:#F2F5EF; --surface:#FBFCF9; --surface-soft:#E4EBDF; --ink:#14201A; --muted:#47594D; --line:#C5D2C0;
      --green:#1E4D32; --green-deep:#123524; --green-soft:#E1EADC; --green-ink:#1E4D32;
      --gold:#E3A72F; --gold-deep:#8A5C00; --gold-soft:#FBF0D3;
      --rose:#B8324A; --rose-soft:#F7E4E8; --blue:#1B7488; --teal-soft:#DCEDF0; --leaf:#4C8B2B; --ok:#3F7D2B;
      --focus:#E3A72F; --shadow:0 14px 40px rgba(20,32,26,.10); --radius:20px;
      --blob-teal:rgba(58,140,133,.34); --blob-leaf:rgba(76,139,43,.26); --blob-gold:rgba(227,167,47,.30); --blob-rose:rgba(184,50,74,.20);
      --font-head:"Bricolage Grotesque","Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
      --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --page:#0F1A14; --surface:#172A1F; --surface-soft:#1F3828; --ink:#EAF0E6; --muted:#A9BBAE; --line:#2A4535;
      --green:#2C6B47; --green-deep:#9BD8B2; --green-soft:#1F3828; --green-ink:#8FD3A9;
      --gold:#E3A72F; --gold-deep:#E3A72F; --gold-soft:#3A3220;
      --rose:#EB8A9C; --rose-soft:#3A2229; --blue:#63BFD2; --teal-soft:#173A3F; --leaf:#93CC70; --ok:#93CC70;
      --focus:#E3A72F; --shadow:0 16px 48px rgba(0,0,0,.35);
      --blob-teal:rgba(58,140,133,.20); --blob-leaf:rgba(76,139,43,.16); --blob-gold:rgba(227,167,47,.12); --blob-rose:rgba(184,50,74,.14);
    }
    body { font: 15px/1.55 var(--font-body); background: var(--page); color: var(--ink); }
    h1, h2, h3, .brand b, .stat-value, .card-head h3, .gathering-count, .gathering-card h3, .top-title h1, .page-heading h2, .modal-head h3 { font-family: var(--font-head); }
    .shell { position: relative; }

    /* --- background whose colours keep drifting and shifting --- */
    body::before, body::after { content: ""; position: fixed; inset: -12%; z-index: -1; pointer-events: none; will-change: transform; }
    body::before {
      background: radial-gradient(34vmax 34vmax at 12% 20%, var(--blob-teal), transparent 62%), radial-gradient(30vmax 30vmax at 78% 78%, var(--blob-leaf), transparent 62%);
      animation: bgDriftA 17s ease-in-out infinite alternate;
    }
    body::after {
      background: radial-gradient(30vmax 30vmax at 86% 14%, var(--blob-gold), transparent 62%), radial-gradient(28vmax 28vmax at 20% 88%, var(--blob-rose), transparent 62%);
      animation: bgDriftB 23s ease-in-out infinite alternate;
    }
    @keyframes bgDriftA { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(7%, 5%, 0) scale(1.18); } }
    @keyframes bgDriftB { from { transform: translate3d(4%, 3%, 0) scale(1.12); } to { transform: translate3d(-6%, -5%, 0) scale(.95); } }

    /* --- sidebar: deep forest, like the site hero --- */
    .sidebar, [data-theme="dark"] .sidebar {
      background: radial-gradient(circle at 10% 96%, rgba(58,140,133,.45) 0, transparent 48%), radial-gradient(circle at 85% 8%, #2C6B47 0, #123524 62%);
      border-right: 0; box-shadow: 6px 0 30px rgba(15,26,20,.22); color: #EAF0E6;
    }
    .brand, .brand b { color: #F2F5EF; }
    .brand b { font-weight: 800; letter-spacing: -.02em; }
    .brand small { color: #A9C7B3; }
    .nav-label, .nav-group-label, .eyebrow, .nav-label { color: var(--gold-deep); }
    .sidebar .nav-label, .sidebar .nav-group-label { color: #E3A72F; }
    .nav-item { color: #C9DACD; }
    .nav-item:hover, [data-theme="dark"] .nav-item:hover { background: rgba(255,255,255,.09); color: #fff; }
    .nav-item.active, [data-theme="dark"] .nav-item.active { background: rgba(255,255,255,.13); color: #fff; box-shadow: inset 4px 0 0 var(--gold); }
    .nav-count, [data-theme="dark"] .nav-count { background: rgba(227,167,47,.22); color: #F5D58A; }
    .privacy-note, [data-theme="dark"] .privacy-note { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); }
    .privacy-note b { color: #F5D58A; } .privacy-note p { color: #C9DACD; }
    .sidebar-foot { color: #9DB8A6; } .sidebar-signout, .sidebar .text-button { color: #F5D58A; }
    .brand-mark img, [data-theme="dark"] .brand-mark img { filter: brightness(1.12) saturate(1.1) drop-shadow(0 2px 6px rgba(0,0,0,.4)); }

    /* --- top bar --- */
    .topbar, [data-theme="dark"] .topbar { background: color-mix(in srgb, var(--page) 78%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px) saturate(1.2); }

    :root {
      --gold:#E3A72F; --gold-deep:#8A5C00; --gold-soft:#FBF0D3;
      --e-a:linear-gradient(90deg,#0E4D32,#1B7A4B,#4FAE63,#E3B341);
      --e-b:linear-gradient(90deg,#0F5A44,#1F8A78,#4BB59A,#9BD36A);
      --e-c:linear-gradient(90deg,#1E6B2B,#4FAE63,#A8D86A,#F0C85A);
      --e-d:linear-gradient(90deg,#0B5B45,#16856A,#3FB08F,#7FD0C0);
      --btn-grad:linear-gradient(135deg,#0E4D32 0%,#1B7A4B 55%,#2A9D7A 100%);
    }
    [data-theme="dark"] {
      --gold:#E3A72F; --gold-deep:#E3B341; --gold-soft:#3A3220;
      --btn-grad:linear-gradient(135deg,#0B3B2A 0%,#1E7A4F 55%,#2A9D7A 100%);
    }

    /* page background: one big soft gradient that glides slowly (no cross-fade, no sharp edges) */
    body::before {
      content: ""; display: block; position: fixed; inset: 0; z-index: -1; pointer-events: none; will-change: background-position;
      background: linear-gradient(115deg,#D6EDDD 0%,#E6F4E8 18%,#D5EEE9 38%,#EAF3D2 58%,#FAEDC8 76%,#DDF0E0 100%);
      background-size: 320% 320%;
      animation: colourFlow 28s ease-in-out infinite alternate;
    }
    [data-theme="dark"] body::before {
      background: linear-gradient(115deg,#08140E 0%,#0D2A1D 22%,#0A2B2A 42%,#1B2C15 62%,#2B2610 80%,#08140E 100%);
      background-size: 320% 320%;
    }
    @keyframes colourFlow { 0% { background-position: 0% 25%; } 100% { background-position: 100% 75%; } }

    /* header: green → teal → lime → a touch of warm gold, drifting slowly */
    .topbar, [data-theme="dark"] .topbar {
      background: linear-gradient(100deg,#0E4D32 0%,#1B7A4B 26%,#2A9D7A 50%,#5FAE4A 76%,#B9B23F 100%);
      background-size: 240% 100%;
      animation: flowX 26s ease-in-out infinite alternate;
    }
    @keyframes flowX { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    .topbar .icon-button, .topbar .search-trigger, .topbar .menu-toggle, .topbar .button.secondary, [data-theme="dark"] .topbar .button.secondary { background: rgba(6,40,26,.30); border-color: rgba(255,255,255,.32); color: #fff; }
    .topbar .icon-button:hover, .topbar .search-trigger:hover, .topbar .menu-toggle:hover, .topbar .button.secondary:hover { background: rgba(6,40,26,.48); border-color: rgba(255,255,255,.6); color: #fff; }
    .topbar .top-title h1 { text-shadow: 0 1px 6px rgba(6,40,26,.35); }

    /* sidebar: deep green with teal warmth at the bottom */
    .sidebar, [data-theme="dark"] .sidebar { background: linear-gradient(175deg,#0B3B2A 0%,#0F5236 42%,#157A57 78%,#1E8A6A 100%); }
    .sidebar .nav-label, .sidebar .nav-group-label { color: #F2D58A; }
    .nav-item.active, [data-theme="dark"] .nav-item.active { box-shadow: inset 4px 0 0 #F2C14E; }
    .nav-item.active::before { background: #F2C14E !important; }

    .page-heading h2 { border-image: linear-gradient(180deg,#E3A72F,#4FAE63 50%,#0E4D32) 1; }
    .eyebrow { color: var(--green-ink); }
    .progress-fill { background: linear-gradient(90deg,#14653F,#4FAE63 60%,#E3B341); }
    .bar, [data-theme="dark"] .bar { background: linear-gradient(180deg,#E3B341,#4FAE63 42%,#14653F); }
    .modal, [data-theme="dark"] .modal { background: linear-gradient(90deg,#0E4D32,#1B7A4B,#4FAE63,#E3B341) 0 0 / 100% 5px no-repeat border-box, var(--surface); }

    /* warm accents come back, softly */
    .stat-icon.gold, .activity-icon.gold, .avatar.sand { background: linear-gradient(135deg,#FBF0D3,#FFF8E6); color: #8A5C00; }
    .pill.gold { background: #FBF0D3; color: #8A5C00; }
    [data-theme="dark"] .stat-icon.gold, [data-theme="dark"] .activity-icon.gold, [data-theme="dark"] .avatar.sand { background: linear-gradient(135deg,#3F3721,#2E2817); color: #F0C85A; }
    [data-theme="dark"] .pill.gold { background: #3A3220; color: #F0C85A; }
    .staff-footnote, .notice, .local-warning, .backup-banner { background: linear-gradient(135deg,#E6F4EA,#FBF3DA); border-color: #D9E3B8; }
    [data-theme="dark"] .staff-footnote, [data-theme="dark"] .notice, [data-theme="dark"] .local-warning, [data-theme="dark"] .backup-banner { background: linear-gradient(135deg,#173426,#2A2A18); border-color: #4A4A25; }
    .backup-banner > svg { color: #A87939; }
    :focus-visible { outline-color: var(--gold); }
    .toast { border-left-color: var(--gold); }
    .card, .button, .tab-btn { animation: none; }
    @media (prefers-reduced-motion: reduce) { body::before, .topbar { animation: none !important; } }

    /* ===== Submitted attendance: read-only, Present on top, then Absent ===== */
    .att-locked { display: grid; gap: 16px; }
    .att-lock-note { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-radius: 12px; background: linear-gradient(135deg,#E6F4EA,#F3F9EC); border: 1px solid #B7DBC1; color: var(--green-deep); font-size: 12px; font-weight: 700; }
    .att-group-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; padding: 9px 14px; border-radius: 12px; font-size: 13px; font-weight: 800; letter-spacing: .02em; }
    .att-group-head b { min-width: 26px; padding: 1px 9px; border-radius: 999px; background: rgba(255,255,255,.28); text-align: center; }
    .att-group-head.present { background: linear-gradient(90deg,#0E4D32,#1B7A4B,#4FAE63); color: #fff; }
    .att-group-head.absent { background: linear-gradient(90deg,#FCE8E3,#FFF3F0); border: 1px solid #F3C7BD; color: #B8432F; }
    .att-group-head.absent b { background: rgba(210,85,63,.14); }
    .att-locked .attendance-list { max-height: none; }
    .att-locked .check-person { cursor: default; }
    [data-theme="dark"] .att-lock-note { background: linear-gradient(135deg,#173426,#1B3B2B); border-color: #2D5A43; color: #D7F3DF; }
    [data-theme="dark"] .att-group-head.absent { background: linear-gradient(90deg,#3A221E,#2E1B18); border-color: #5A2F28; color: #F08B76; }

    /* ===== People → Manage panel ===== */
    .manage-card { margin-bottom: 15px; }
    .manage-body { display: grid; gap: 14px; }
    .manage-counts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .manage-counts > div { padding: 12px 14px; border-radius: 14px; background: linear-gradient(135deg,var(--green-soft),var(--surface)); border: 1px solid var(--line); }
    .manage-counts b { display: block; font-size: 22px; color: var(--green-ink); }
    .manage-counts span { font-size: 12px; color: var(--muted); }
    .manage-block { border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; background: var(--surface); }
    .manage-block .history-list { margin: 0; }
    .manage-num { display: inline !important; font-style: normal; font-weight: 800; color: var(--green-ink); }
    .manage-actions { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .button.secondary.is-on { background: var(--green-soft); }
    .dashboard-grid > .card:only-child { grid-column: 1 / -1; }
    @media (max-width: 720px) { .manage-counts { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    /* Follow-Up tracking additions */
    .pill.ok { background: #e2f1e7; color: #276a40; }
    .pill.high { background: #f8dcd9; color: #a12c24; box-shadow: inset 0 0 0 1px #e8aea8; font-weight: 800; }
    [data-theme="dark"] .pill.ok { background: #244030; color: #a5e3b8; }
    [data-theme="dark"] .pill.high { background: #4c2326; color: #ffb8b0; box-shadow: inset 0 0 0 1px #7d3b3f; }
    .follow-card.is-urgent { border-left: 4px solid #c4483f; }
    .follow-pills { display: inline-flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .follow-track { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
    .prio-strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .prio-chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--ink); font-size: 12px; }
    .nav-item { position: relative; } .nav-new { top: 6px; right: 8px; }
    .fu-section { margin: 0 0 22px; }
    .fu-section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 10px; }
    .fu-section-head h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .fu-section-head p { margin: 0; font-size: 12px; }
    .prio-chip.on { background: var(--green-soft); border-color: var(--green); font-weight: 700; }
    .track-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 15px; }
    .trk-box { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-soft); }
    .trk-title { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
    .wk-dots { display: flex; gap: 5px; margin: 10px 0 4px; }
    .wk-dot { display: inline-block; width: 16px; height: 16px; border-radius: 5px; background: #d9d2cf; }
    .wk-dot.present { background: #3a9a5f; }
    .wk-dot.absent { background: #cf5a52; }
    .wk-dot.pending, .wk-dot.grace { background: transparent; border: 1.5px dashed #a99da0; }
    .name-link { padding: 0; text-align: left; }
  </style>
</head>

        return `${pageHeading("People & follow-up", "New Converts / Guests", "Everyone still being followed up. Open a name to see when their Follow-Up was completed and whether they are attending.", actions)}

          ${uncontactedBanner()}
          <div class="report-note">The imported workbook records these lists by month (August 2025), not by exact day. New entries can show an exact date when one is entered.</div>
          <div style="display:grid;grid-template-columns:minmax(0,1fr);gap:15px">${renderNewPeopleTable("New Converts", converts)}${renderNewPeopleTable("Guests", firstTimers)}</div>`;
      }

      function renderAttendance() {
        const people = activeMembers().sort((a, b) => fullName(a).localeCompare(fullName(b)));
        const session = sessionFor(ui.attendanceDate, ui.attendanceType);
        const marked = session?.memberIds || [];
        const sessions = [...db.attendance].sort((a, b) => b.date.localeCompare(a.date));
        const list = people.map((m, i) => `<label class="check-person ${marked.includes(m.id) ? "is-present" : "is-absent"}">${badgeAvatar(fullName(m), i)}<span>${escapeHtml(fullName(m))}</span><em class="att-pill">${marked.includes(m.id) ? "Present" : "Absent"}</em><input type="checkbox" name="attendee" value="${escapeHtml(m.id)}" ${marked.includes(m.id) ? "checked" : ""} aria-label="Mark ${escapeHtml(fullName(m))} present"></label>`).join("");
        const presentPeople = marked.map(id => getMember(id)).filter(Boolean).sort((a, b) => fullName(a).localeCompare(fullName(b)));
        const absentPeople = people.filter(m => !marked.includes(m.id));
        const lockRow = (m, i, on) => `<div class="check-person ${on ? "is-present" : "is-absent"}">${badgeAvatar(fullName(m), i)}<span>${escapeHtml(fullName(m))}</span><em class="att-pill">${on ? "Present" : "Absent"}</em></div>`;
        const lockedView = session ? `<div class="card-body att-locked"><div class="att-lock-note">${icon("shield", 16)} Submitted and locked. Attendance for this date can no longer be marked or changed.</div><div><div class="att-group-head present"><span>Present</span><b>${presentPeople.length}</b></div><div class="attendance-list">${presentPeople.map((m, i) => lockRow(m, i, true)).join("") || `<div class="empty">Nobody was marked present.</div>`}</div></div><div><div class="att-group-head absent"><span>Absent</span><b>${absentPeople.length}</b></div><div class="attendance-list">${absentPeople.map((m, i) => lockRow(m, i, false)).join("") || `<div class="empty">Everyone was present.</div>`}</div></div></div>` : "";
        const trackAbsences = session && WEEKLY_GATHERINGS.includes(gatheringName(session));
        const absentees = trackAbsences ? people.filter(m => !marked.includes(m.id) && isExpected(m, session.date, gatheringName(session))) : [];
        const callList = trackAbsences ? `<section class="card" style="margin-top:15px">${cardHead(`Missed ${gatheringMeta(gatheringName(session)).label}`, absentees.length ? `${absentees.length} flagged for a follow-up call` : "Everyone expected was present", `<button class="text-button" data-page="followups">Open follow-ups</button>`)}<div class="card-body"><div class="due-list">${absentees.map((m, i) => { const n = missedStreak(m.id, session.date, gatheringName(session)); return `<div class="due-row">${badgeAvatar(fullName(m), i)}<div class="due-name"><b>${escapeHtml(fullName(m))}</b><span>${escapeHtml(m.phone || "No phone recorded")}</span></div><span class="pill rose">${n > 1 ? `Missed ${n} in a row` : "Missed 1 service"}</span>${m.phone ? `<a class="button secondary small" href="tel:${encodeURIComponent(String(m.phone).replace(/[^\d+]/g, ""))}">Call</a>` : ""}</div>`; }).join("") || `<div class="empty"><b>No absences</b>Nobody needs a call for this service.</div>`}</div></div></section>` : "";
        const history = sessions.map(s => `<div class="history-item"><div><b>${escapeHtml(gatheringMeta(gatheringName(s)).label)} · ${dateLabel(s.date)}</b><span>${s.memberIds.length} people recorded ${trendBadge(s)}${s.note ? ` · ${escapeHtml(s.note)}` : ""}</span></div><button class="text-button" data-action="open-attendance" data-date="${escapeHtml(s.date)}" data-type="${escapeHtml(gatheringName(s))}">Open</button></div>`).join("");
        const typeOptions = GATHERING_TYPES.map(item => `<option value="${escapeHtml(item.value)}" ${ui.attendanceType === item.value ? "selected" : ""}>${escapeHtml(item.label)} · ${escapeHtml(item.cadence)}</option>`).join("");
        return `${pageHeading("Gatherings & attendance", "Attendance", "Record each gathering separately; monthly meetings are not treated as weekly absences.", `<button class="button secondary" data-action="attendance-sunday">${icon("calendar", 15)} This Sunday</button><button class="button secondary" data-action="attendance-wednesday">${icon("calendar", 15)} This Wednesday</button><button class="button" data-scan="open">${icon("file", 15)} Scan sheets</button>`)}
          ${attendanceBanner()}
          <div class="att-layout">
            <section class="card">${cardHead(session ? "Attendance submitted" : "Record a gathering", session ? `${gatheringMeta(gatheringName(session)).label} · ${dateLabel(session.date)}` : "Attendance tracking starts October 1, 2026.", `<div class="attendance-tools"><label class="field"><span>Gathering</span><select class="select" id="attendance-type">${typeOptions}</select></label><label class="field"><span>Service date</span><input class="input" style="min-height:34px" type="date" id="attendance-date" min="${ATTENDANCE_START_DATE}" value="${escapeHtml(ui.attendanceDate)}"></label></div>`)}
              ${session ? lockedView : `<form id="attendance-form" class="card-body">
                <div class="attendance-list">${list || `<div class="empty">Add people to the directory before marking attendance.</div>`}</div>
                <div class="attendance-summary"><span><b id="attendance-count">${marked.length}</b> present · <b id="absent-count">${people.length - marked.length}</b> not marked present <button class="text-button" type="button" data-enh="all-present">Mark everyone present</button></span><button class="button" type="submit">Submit attendance</button></div>
              </form>`}
            </section>
            <section class="card">${cardHead("Recent gatherings", `${sessions.length} saved ${sessions.length === 1 ? "record" : "records"}`)}<div class="card-body"><div class="history-list">${history || `<div class="empty"><b>No gatherings yet</b>Saved attendance records will appear here.</div>`}</div></div></section>
          </div>
          ${callList}`;
      }

      function renderEvents() {
        const [year, month] = ui.calendarMonth.split("-").map(Number);
        const firstDay = new Date(year, month - 1, 1, 12);
        const offset = firstDay.getDay();
        const totalDays = new Date(year, month, 0).getDate();
        const cellCount = Math.ceil((offset + totalDays) / 7) * 7;
        const allEvents = [...(db.events || [])];
        const monthEvents = allEvents.filter(e => e.date?.startsWith(ui.calendarMonth)).sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));
        const cells = Array.from({ length: cellCount }, (_, index) => {
          const date = new Date(year, month - 1, index - offset + 1, 12);
          const iso = isoDate(date);
          const outside = date.getMonth() !== month - 1;
          const dayEvents = allEvents.filter(e => e.date === iso).sort((a, b) => a.startTime.localeCompare(b.startTime));
          return `<div class="calendar-cell ${outside ? "outside" : ""}"><div class="calendar-day-num"><span>${date.getDate()}</span>${outside ? "" : `<button type="button" data-action="new-event-for-date" data-date="${iso}" aria-label="Add event on ${dateLabel(iso)}">${icon("plus", 13)}</button>`}</div>${dayEvents.slice(0, 2).map(e => `<button type="button" class="calendar-event ${e.status === "cancelled" ? "cancelled" : ""}" data-action="edit-event" data-id="${escapeHtml(e.id)}" title="${escapeHtml(e.title)} · ${escapeHtml(e.startTime)}">${escapeHtml(e.startTime)} ${escapeHtml(e.title)}</button>`).join("")}${dayEvents.length > 2 ? `<span class="subtle">+${dayEvents.length - 2} more</span>` : ""}</div>`;
        }).join("");
        const eventsList = monthEvents.map(e => {
          const d = new Date(`${e.date}T12:00:00`);
          return `<article class="event-row ${e.status === "cancelled" ? "event-cancelled" : ""}">
            <div class="event-date"><b>${d.getDate()}</b><span>${d.toLocaleDateString(undefined, { weekday: "short", month: "short" })}</span></div>
            <div class="event-copy"><b>${escapeHtml(e.title)} ${e.status === "cancelled" ? `<span class="pill gray">Cancelled</span>` : ""}</b><span>${escapeHtml(e.startTime)}–${escapeHtml(e.endTime)} · ${escapeHtml(e.room)} · ${escapeHtml(e.ministry || "Church")}</span><span>${e.lead ? `Lead: ${escapeHtml(e.lead)}` : "No event lead assigned"}</span></div>
            <div class="event-actions">${e.status !== "cancelled" ? `<button class="button secondary small" data-action="edit-event" data-id="${escapeHtml(e.id)}">Edit</button><button class="button ghost small" data-action="cancel-event" data-id="${escapeHtml(e.id)}">Cancel</button>` : `<button class="button secondary small" data-action="edit-event" data-id="${escapeHtml(e.id)}">Edit</button>`}</div>
          </article>`;
        }).join("");
        return `${pageHeading("Ministry activities & room bookings", "Events & Calendar", "Schedule services, ministry activities, and room reservations in one calendar.", `<button class="button" data-action="new-event">${icon("plus", 15)} Add event</button>`)}
          <section class="card table-card">
            <div class="card-head"><div><span class="eyebrow">Room schedule</span><h3>Monthly calendar</h3></div><div class="calendar-tools"><button class="icon-button" data-action="calendar-month" data-step="-1" aria-label="Previous month">‹</button><h3>${escapeHtml(new Date(year, month - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }))}</h3><button class="icon-button" data-action="calendar-month" data-step="1" aria-label="Next month">›</button><button class="button secondary small" data-action="calendar-current">Today</button></div></div>
            <div class="calendar-weekdays">${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="calendar-weekday">${d}</div>`).join("")}</div>
            <div class="calendar-grid">${cells}</div>
          </section>
          <section class="card" style="margin-top:15px">${cardHead(`Events in ${new Date(year, month - 1, 1).toLocaleDateString(undefined, { month: "long" })}`, `${monthEvents.filter(e => e.status !== "cancelled").length} scheduled · ${monthEvents.filter(e => e.status === "cancelled").length} cancelled`)}<div class="card-body"><div class="event-list">${eventsList || `<div class="empty"><b>No events this month</b>Add an activity to start coordinating rooms and ministry schedules.</div>`}</div></div></section>`;
      }

      const projectStatusNames = { pending: "Pending", in_progress: "In Progress", on_hold: "On Hold", completed: "Completed" };
      const priorityNames = { low: "Low", medium: "Medium", high: "High" };
      function projectStatusPill(status) {
        const classes = { pending: "pill gray", in_progress: "pill gold", on_hold: "pill rose", completed: "pill" };
        return `<span class="${classes[status] || "pill gray"}">${escapeHtml(projectStatusNames[status] || "Pending")}</span>`;
      }
      function taskPriorityPill(priority) {
        const classes = { low: "pill gray", medium: "pill gold", high: "pill rose" };
        return `<span class="${classes[priority] || "pill gray"}">${escapeHtml(priorityNames[priority] || "Medium")}</span>`;
      }
      function filteredProjectTasks() {
        const search = ui.projectTaskSearch.trim().toLowerCase();
        return [...(db.projectTasks || [])].filter(task => {
          const project = (db.projects || []).find(p => p.id === task.projectId);
          const haystack = `${task.title || ""} ${task.description || ""} ${task.assignee || ""} ${project?.name || ""}`.toLowerCase();
          return (ui.projectTaskStatus === "all" || task.status === ui.projectTaskStatus) &&
            (ui.projectTaskProject === "all" || (ui.projectTaskProject === "unassigned" ? !task.projectId : task.projectId === ui.projectTaskProject)) &&
            (!search || haystack.includes(search));
        }).sort((a, b) => (a.status === "completed") - (b.status === "completed") || (a.dueDate || "9999").localeCompare(b.dueDate || "9999"));
      }
      function projectTaskRowsMarkup() {
        const today = isoDate(new Date());
        return filteredProjectTasks().map(task => {
          const project = (db.projects || []).find(p => p.id === task.projectId);
          const overdue = task.dueDate && task.dueDate < today && task.status !== "completed";
          return `<div class="task-row ${task.status === "completed" ? "task-complete" : ""}">
            <div class="task-title"><b>${escapeHtml(task.title)}</b>${task.description ? `<small>${escapeHtml(task.description)}</small>` : ""}</div>
            <span>${escapeHtml(project?.name || "Church-wide")}</span>
            <span>${escapeHtml(task.assignee || "Unassigned")}</span>
            <span class="${overdue ? "amount-out" : ""}">${overdue ? "Overdue · " : ""}${escapeHtml(shortDate(task.dueDate))}</span>
            <span>${taskPriorityPill(task.priority)}</span>
            <select class="select" data-task-status="${escapeHtml(task.id)}" aria-label="Task status">${Object.entries(projectStatusNames).map(([value, label]) => `<option value="${value}" ${task.status === value ? "selected" : ""}>${label}</option>`).join("")}</select>
            <div class="task-actions"><button class="button secondary small" data-action="edit-project-task" data-id="${escapeHtml(task.id)}">Edit</button><button class="icon-button" style="width:30px;height:30px" data-action="delete-project-task" data-id="${escapeHtml(task.id)}" aria-label="Delete ${escapeHtml(task.title)}">${icon("trash", 13)}</button></div>
          </div>`;
        }).join("") || `<div class="empty"><b>No tasks match</b>Change the filters or add a task to this church project board.</div>`;
      }
      function updateProjectTasksOnly() {
        if (currentPage !== "projects") return;
        const rows = document.getElementById("project-task-rows");
        const count = document.getElementById("project-task-count");
        if (rows) rows.innerHTML = projectTaskRowsMarkup();
        if (count) {
          const total = filteredProjectTasks().length;
          count.textContent = `${total} ${total === 1 ? "task" : "tasks"}`;
        }
      }
      function renderProjects() {
        const projects = db.projects || [];
        const tasks = db.projectTasks || [];
        const activeProjects = projects.filter(p => p.status === "in_progress");
        const openTasks = tasks.filter(t => t.status !== "completed");
        const overdueTasks = openTasks.filter(t => t.dueDate && t.dueDate < isoDate(new Date()));
        const completedTasks = tasks.filter(t => t.status === "completed");
        const projectCards = projects.map(project => {
          const linkedTasks = tasks.filter(task => task.projectId === project.id);
          const complete = linkedTasks.filter(task => task.status === "completed").length;
          const percent = linkedTasks.length ? Math.round(complete / linkedTasks.length * 100) : (project.status === "completed" ? 100 : 0);
          return `<article class="card project-card">
            <div class="project-card-top"><div><h3>${escapeHtml(project.name)}</h3><p>${escapeHtml(project.description || "No project description")}</p></div>${projectStatusPill(project.status)}</div>
            <div class="project-meta"><span class="pill blue">${escapeHtml(project.ministry || "Church-wide")}</span>${taskPriorityPill(project.priority)}<span class="subtle">Lead: ${escapeHtml(project.owner || "Unassigned")}</span><span class="subtle">Due: ${escapeHtml(dateLabel(project.dueDate))}</span></div>
            <div class="project-progress"><div class="project-progress-top"><span>${complete} of ${linkedTasks.length} tasks complete</span><b>${percent}%</b></div><div class="progress-track" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100" aria-label="${escapeHtml(project.name)} task completion"><div class="progress-fill" style="width:${percent}%"></div></div></div>
            ${projectExtras(project)}<div class="project-controls"><span class="subtle">Project status</span><select class="select" data-project-status="${escapeHtml(project.id)}" aria-label="Status for ${escapeHtml(project.name)}">${Object.entries(projectStatusNames).map(([value, label]) => `<option value="${value}" ${project.status === value ? "selected" : ""}>${label}</option>`).join("")}</select><button class="button secondary small" data-action="edit-project" data-id="${escapeHtml(project.id)}">Edit</button></div>
          </article>`;
        }).join("");
        const projectOptions = projects.map(project => `<option value="${escapeHtml(project.id)}" ${ui.projectTaskProject === project.id ? "selected" : ""}>${escapeHtml(project.name)}</option>`).join("");
        const headingActions = `<button class="button secondary" data-action="new-project">${icon("plus", 15)} Add project</button><button class="button" data-action="new-project-task">${icon("plus", 15)} Add task</button>`;
        return `${pageHeading("Church work & next steps", "Projects & Tasks", "See what needs to be done, who is responsible, when it is due, and which projects are ongoing.", headingActions)}
          <div class="grid project-stats">
            <article class="card finance-stat"><span>All projects</span><b>${projects.length}</b></article>
            <article class="card finance-stat"><span>Ongoing now</span><b>${activeProjects.length}</b></article>
            <article class="card finance-stat"><span>Tasks still open</span><b>${openTasks.length}</b></article>
            <article class="card finance-stat"><span>Tasks overdue</span><b>${overdueTasks.length}</b></article>
          </div>
          <section class="card" style="margin-bottom:15px">${cardHead("Church projects", `${activeProjects.length} ongoing · ${projects.filter(p => p.status === "pending").length} pending · ${projects.filter(p => p.status === "on_hold").length} on hold · ${projects.filter(p => p.status === "completed").length} completed`)}
            <div class="card-body"><div class="project-grid">${projectCards || `<div class="empty"><b>No projects yet</b>Add a church project to track its owner, deadline, and progress.</div>`}</div></div>
          </section>
          <section class="card table-card">${cardHead("Task board", `${openTasks.length} open · ${completedTasks.length} completed`, `<span class="subtle" id="project-task-count">${filteredProjectTasks().length} tasks</span>`)}
            <div class="card-body"><div class="task-toolbar">
              <input class="input" id="project-task-search" type="search" value="${escapeHtml(ui.projectTaskSearch)}" placeholder="Search tasks, people, projects…" aria-label="Search tasks">
              <select class="select" id="project-task-status" aria-label="Filter by task status"><option value="all" ${ui.projectTaskStatus === "all" ? "selected" : ""}>All statuses</option>${Object.entries(projectStatusNames).map(([value, label]) => `<option value="${value}" ${ui.projectTaskStatus === value ? "selected" : ""}>${label}</option>`).join("")}</select>
              <select class="select" id="project-task-project" aria-label="Filter by project"><option value="all">All projects</option><option value="unassigned" ${ui.projectTaskProject === "unassigned" ? "selected" : ""}>Church-wide</option>${projectOptions}</select>
            </div></div>
            <div class="task-list"><div class="task-row task-header"><span>Task</span><span>Project</span><span>Assigned to</span><span>Due</span><span>Priority</span><span>Status</span><span>Actions</span></div><div id="project-task-rows">${projectTaskRowsMarkup()}</div></div>
          </section>`;
      }

      function renderVolunteers() {
        const events = (db.events || []).filter(e => e.status !== "cancelled").sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));
        if (!events.some(e => e.id === ui.volunteerEventId)) ui.volunteerEventId = events[0]?.id || "";
        const selectedEvent = events.find(e => e.id === ui.volunteerEventId);
        const assignments = (db.servingAssignments || []).filter(a => a.eventId === selectedEvent?.id);
        const allVolunteers = db.volunteers || [];
        const people = allVolunteers.filter(v => v.active !== false);
        const options = events.map(e => `<option value="${escapeHtml(e.id)}" ${e.id === ui.volunteerEventId ? "selected" : ""}>${escapeHtml(dateLabel(e.date))} · ${escapeHtml(e.title)}</option>`).join("");
        const scheduled = assignments.map((a, i) => {
          const v = db.volunteers.find(x => x.id === a.volunteerId);
          const dayName = selectedEvent ? new Date(`${selectedEvent.date}T12:00:00`).toLocaleDateString(undefined, { weekday: "long" }) : "";
          const available = v?.availableDays?.includes(dayName);
          return `<div class="assignment-row"><div class="assignment-person">${badgeAvatar(v?.fullName || "?", i)}<span><b>${escapeHtml(v?.fullName || "Volunteer removed")}</b><small>${escapeHtml(a.role)} · ${available ? "Availability matches" : "Check availability"}</small></span></div><select class="select" data-assign-status="${escapeHtml(a.id)}" aria-label="Serving status"><option value="invited" ${a.status === "invited" ? "selected" : ""}>Invited</option><option value="confirmed" ${a.status === "confirmed" ? "selected" : ""}>Confirmed</option><option value="declined" ${a.status === "declined" ? "selected" : ""}>Declined</option></select><button class="icon-button" style="width:30px;height:30px" data-action="remove-assignment" data-id="${escapeHtml(a.id)}" aria-label="Remove assignment">${icon("close", 13)}</button></div>`;
        }).join("");
        const volunteerCards = allVolunteers.map((v, i) => `<article class="card volunteer-card"><div class="volunteer-head">${badgeAvatar(v.fullName, i)}<div><b>${escapeHtml(v.fullName)} ${v.active === false ? `<span class="pill gray">Inactive</span>` : ""}</b><small>${escapeHtml(v.phone || "No phone")} · ${escapeHtml(v.email || "No email")}</small></div><button class="icon-button" style="width:31px;height:31px" data-action="edit-volunteer" data-id="${escapeHtml(v.id)}" aria-label="Edit volunteer">${icon("settings", 14)}</button></div><div class="volunteer-meta">${(v.teams || []).map(team => `<span class="pill blue">${escapeHtml(team)}</span>`).join("")}${(v.availableDays || []).map(day => `<span class="pill gray">${escapeHtml(day)}</span>`).join("")}</div></article>`).join("");
        const today = isoDate(new Date());
        const reminderItems = (db.servingAssignments || []).filter(a => a.status !== "declined").map(a => {
          const e = db.events.find(x => x.id === a.eventId && x.status !== "cancelled");
          const v = db.volunteers.find(x => x.id === a.volunteerId);
          return e && v && e.date >= today && e.date <= shiftDate(14) ? { a, e, v } : null;
        }).filter(Boolean).sort((a, b) => a.e.date.localeCompare(b.e.date)).map(({ a, e, v }) => {
          const message = `Hi ${firstName({ firstName: v.fullName })}, a reminder that you are scheduled for ${e.title} as ${a.role} on ${dateLabel(e.date)} at ${e.startTime}. Please contact ${e.lead || "your team lead"} if your availability has changed.`;
          return `<div class="reminder-row"><i class="activity-icon gold">${icon("clock", 14)}</i><div class="reminder-copy"><b>${escapeHtml(v.fullName)} · ${escapeHtml(e.title)}</b><span>${escapeHtml(dateLabel(e.date))} at ${escapeHtml(e.startTime)} · ${escapeHtml(a.role)}</span></div>${v.phone ? `<a class="button secondary small" href="sms:${encodeURIComponent(v.phone.replace(/[^\d+]/g, ""))}?body=${encodeURIComponent(message)}">Prepare SMS</a>` : `<span class="pill gray">No phone</span>`}</div>`;
        }).join("");
        return `${pageHeading("Serve together", "Volunteer Coordination", "Build serving rosters around ministry events and each volunteer’s stated availability.", `<button class="button secondary" data-action="add-volunteer">${icon("plus", 15)} Add volunteer</button><button class="button" data-action="assign-volunteer">${icon("check", 15)} Add to roster</button>`)}
          <div class="grid dashboard-grid">
            <section class="card">${cardHead("Serving roster", selectedEvent ? `${dateLabel(selectedEvent.date)} · ${selectedEvent.startTime} · ${selectedEvent.room}` : "Add an event to create a roster", `<label class="field"><span>Choose event</span><select class="select" id="volunteer-event" ${events.length ? "" : "disabled"}>${options || `<option>No scheduled events</option>`}</select></label>`)}<div class="card-body">${selectedEvent ? `<div class="event-copy" style="margin-bottom:8px"><b>${escapeHtml(selectedEvent.title)}</b><span>${escapeHtml(selectedEvent.ministry || "Church activity")}</span></div><div class="event-list">${scheduled || `<div class="empty"><b>No one scheduled yet</b>Add a volunteer and role to build this serving roster.</div>`}</div>` : `<div class="empty"><b>No scheduled events</b>Create an event before adding a serving roster.</div>`}</div></section>
            <section class="card">${cardHead("Reminders to prepare", "Upcoming serving assignments · one-tap SMS drafts")}<div class="card-body"><div class="history-list">${reminderItems || `<div class="empty"><b>No reminders due soon</b>Upcoming volunteer assignments will appear here.</div>`}</div></div></section>
          </div>
          <section class="card" style="margin-top:15px">${cardHead("Volunteer directory", `${people.length} active volunteers`, "")}<div class="card-body"><div class="volunteer-grid">${volunteerCards || `<div class="empty"><b>No volunteers yet</b>Add a volunteer and record their availability.</div>`}</div></div></section>`;
      }

      function renderGroups() {

      let modalReturnFocus = null;
      function openModal(title, subtitle, body, wide = false) {
        const root = document.getElementById("modal-root");
        if (!root.firstChild) modalReturnFocus = document.activeElement;
        root.innerHTML = `<div class="modal-backdrop" data-action="backdrop"><section class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><header class="modal-head"><div><h3>${escapeHtml(title)}</h3></div><button class="icon-button" type="button" data-action="close-modal" aria-label="Close">${icon("close", 15)}</button></header><div class="modal-body">${body}</div></section></div>`;
        document.body.style.overflow = "hidden";
        setTimeout(() => root.querySelector("input, textarea, select, button")?.focus(), 30);
      }
      function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
        document.body.style.overflow = "";
        if (modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus();
        modalReturnFocus = null;
      }
      document.addEventListener("keydown", event => {
        const modal = document.querySelector("#modal-root .modal");
        if (event.key === "Escape") {
          if (modal) { closeModal(); } else if (sidebarOpen) { sidebarOpen = false; render(); }
          return;
        }
        if (event.key === "Tab" && modal) {
          const items = [...modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
          if (!items.length) return;
          const first = items[0], last = items[items.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });

      function parseMpesa(text) {
        const code = text.match(/\b([A-Z0-9]{10})\b/i)?.[1]?.toUpperCase() || "";
        const amountMatch = text.match(/(?:Ksh|KES)\s*([\d,]+(?:\.\d{1,2})?)/i);
        const amount = amountMatch ? amountMatch[1].replace(/,/g, "") : "";
        const phone = text.match(/(?:\+?254|0)?7\d{8}\b/)?.[0] || "";
        const direction = /\b(received|deposit|from)\b/i.test(text) ? "income" : /\b(sent|paid|payment to|withdrawal)\b/i.test(text) ? "expense" : "income";
        const partyMatch = text.match(/\b(?:from|to)\s+(.+?)(?=\s+(?:on|at)\s+|\s+\+?254|\s+0?7\d{8}|$)/i);
        const party = partyMatch?.[1]?.replace(/[.,;]+$/, "").trim() || "";
        const dateMatch = text.match(/\b(\d{1,2}\/\d{1,2}\/\d{2,4})\b/);
        let date = isoDate(new Date());
        if (dateMatch) {
          const [d, m, y] = dateMatch[1].split("/").map(Number);
          const year = y < 100 ? 2000 + y : y;
          const parsed = new Date(year, m - 1, d, 12);
          if (!Number.isNaN(parsed.getTime())) date = isoDate(parsed);
        }
        return { code, amount, phone, direction, party, date };
      }

        if (rows.length < 2) return [];

      function renderChat() {

      /* ===== Improvements v4: structured fields, phone clean-up, birthdays, duplicates, data checks, consent & WhatsApp ===== */
      const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const MONTH_DAYS = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      const byName = (a, b) => fullName(a).localeCompare(fullName(b));
      const splitList = v => [...new Set(String(v || "").split(/[;,]/).map(s => s.trim()).filter(Boolean))];

      function normalizePhone(raw) {
        const s = String(raw || "").trim();
        if (!s) return "";
        const digits = s.replace(/\D/g, "");
        if (!digits) return s;
        if (digits.length === 12 && digits.startsWith("254") && /^254[17]/.test(digits)) return "+" + digits;
        if (digits.length === 10 && /^0[17]/.test(digits)) return "+254" + digits.slice(1);
        if (digits.length === 9 && /^[17]/.test(digits)) return "+254" + digits;
        if (s.startsWith("+") && digits.length >= 9 && digits.length <= 15) return "+" + digits;
        return s;
      }
      const phoneDigits = p => String(p || "").replace(/\D/g, "");
      const phoneValid = p => /^\+\d{9,15}$/.test(String(p || ""));
      function waLink(m, text) {
        let d = phoneDigits(normalizePhone(m.phone));

      }

      function parseBirthday(v) {
        const s = String(v || "").trim();
        if (!s) return "";
        let mt = s.match(/^(\d{2})-(\d{2})$/), month, day;
        if (mt) { month = +mt[1]; day = +mt[2]; }
        else {
          mt = s.match(/^(\d{1,2})\s*(?:st|nd|rd|th)?\s*[\/\-\s]\s*([A-Za-z]{3,})/i);
          if (!mt) return "";
          day = +mt[1]; month = MONTH_NAMES.findIndex(n => n.slice(0, 3).toLowerCase() === mt[2].slice(0, 3).toLowerCase()) + 1;
        }
        if (!month || month > 12 || !day || day > MONTH_DAYS[month - 1]) return "";
        return `${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }
      const bdParts = m => /^\d{2}-\d{2}$/.test(m?.birthday || "") ? { m: +m.birthday.slice(0, 2), d: +m.birthday.slice(3) } : null;
      const bdLabel = m => { const p = bdParts(m); return p ? `${p.d} ${MONTH_NAMES[p.m - 1]}` : ""; };
      function daysToBirthday(m, from = new Date()) {
        const p = bdParts(m); if (!p) return null;
        const t = new Date(from.getFullYear(), from.getMonth(), from.getDate());
        let n = new Date(t.getFullYear(), p.m - 1, p.d);
        if (n < t) n = new Date(t.getFullYear() + 1, p.m - 1, p.d);
        return Math.round((n - t) / 864e5);
      }

      /* Move title / birthday / ministry lists out of the free-text note into real fields (runs once per record) */
      function migrateOne(m) {
        if (!m || m.v >= 2) return false;

        let title = m.title || "", bd = m.birthday || "", min = Array.isArray(m.ministries) ? m.ministries : [];
        for (const p of parts) {

          if ((mt = p.match(/^Ministry\/list:\s*(.*)$/i))) min = [...new Set([...min, ...splitList(mt[1])])];
          else if ((mt = p.match(/^Title:\s*(.*)$/i))) title = title || mt[1].trim();
          else if ((mt = p.match(/^Birthday:\s*(.*)$/i))) { const b = parseBirthday(mt[1]); if (b) bd = bd || b; else keep.push(p); }
          else keep.push(p);

        m.title = title; m.birthday = bd; m.ministries = min; m.notes = keep.join(" · ");

      function migrateAll() { let n = 0; for (const m of db.members || []) if (migrateOne(m)) n++; return n; }

      /* ---- Duplicates ---- */
      const dupKey = list => list.map(x => x.id).sort().join("|");
      function findDuplicateGroups() {
        const ignore = new Set(db.settings.dupIgnore || []);
        const byPhoneFirst = new Map(), byFull = new Map(), groups = [], seen = new Set();
        const push = (map, k, m) => { if (!map.has(k)) map.set(k, []); map.get(k).push(m); };
        for (const m of activeMembers()) {
          const d = phoneDigits(normalizePhone(m.phone)), fn = String(m.firstName || "").toLowerCase().trim();
          if (d.length >= 9 && fn) push(byPhoneFirst, `${d}|${fn}`, m);
          const nk = `${m.firstName || ""} ${m.lastName || ""}`.toLowerCase().replace(/[^a-z\s]/g, "").replace(/\s+/g, " ").trim();
          if (nk.includes(" ")) push(byFull, nk, m);
        }
        const add = (list, reason) => {
          if (list.length < 2) return;
          const key = dupKey(list); if (seen.has(key) || ignore.has(key)) return;
          seen.add(key); groups.push({ reason, key, list: [...list].sort((a, b) => (b.phone ? 1 : 0) + (b.area ? 1 : 0) - (a.phone ? 1 : 0) - (a.area ? 1 : 0)) });
        };
        for (const l of byPhoneFirst.values()) add(l, "Same first name and phone number");
        for (const l of byFull.values()) add(l, "Same full name");

      }
      function mergeMembers(keepId, dropId) {

        if (!k || !d || k === d) return false;
        for (const f of ["phone", "email", "area", "title", "birthday", "joinedAt"]) if (!k[f] && d[f]) k[f] = d[f];
        k.ministries = [...new Set([...(k.ministries || []), ...(d.ministries || [])])];
        if (d.notes && !String(k.notes || "").includes(d.notes)) k.notes = [k.notes, d.notes].filter(Boolean).join(" · ");
        if (d.smsConsent && !k.smsConsent) { k.smsConsent = true; k.consentAt = d.consentAt || ""; k.consentNote = d.consentNote || ""; }
        if (k.type !== "member" && d.type === "member") k.type = "member";
        for (const f of db.followups || []) if (f.memberId === dropId) f.memberId = keepId;
        for (const s of db.souls || []) if (s.memberId === dropId) s.memberId = keepId;

      }

      /* --- Church Attendance Health ---

         Green = 4+ consecutive attended weeks (graduates) · Amber = building · Red = missed 2+ weeks in a row, or never attended. */
      function attendanceProfile(m) {
        const idx = attendanceIndex(), set = idx.weeks.get(m.id) || new Set();
        const enroll = enrolledOn(m), first = sundayOf(enroll < ATTENDANCE_START_DATE ? ATTENDANCE_START_DATE : enroll), cur = sundayOf(isoDate(new Date()));
        const weeks = [];
        for (let w = first, guard = 0; w <= cur && guard < 400; w = weekAdd(w, 1), guard++) {
          weeks.push({ week: w, state: set.has(w) ? "present" : w === cur ? "pending" : w === first ? "grace" : "absent" });
        }
        let streak = 0, missed = 0;
        for (let i = weeks.length - 1; i >= 0; i--) { const s = weeks[i].state; if (s === "pending") continue; if (s === "present") streak++; else break; }
        for (let i = weeks.length - 1; i >= 0; i--) { const s = weeks[i].state; if (s === "pending") continue; if (s === "absent") missed++; else break; }
        const win = weeks.slice(-HEALTH_WINDOW), eligible = win.filter(w => w.state === "present" || w.state === "absent").length, got = win.filter(w => w.state === "present").length;

        const regularity = eligible ? Math.round(100 * got / eligible) : null;

      /* --- Follow-Up priority (High / Medium / Low) --- */
      function autoPriority(f) {
